---
- name: Check if openclaw-gateway service file exists
  ansible.builtin.stat:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service
  register: daemon_service

- name: Install OpenClaw daemon
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    openclaw daemon install
  args:
    executable: /bin/bash
  when: not daemon_service.stat.exists

- name: Check daemon service file version matches installed binary
  when: daemon_service.stat.exists
  block:
    - name: Extract version from daemon service file
      ansible.builtin.shell: |
        grep -oP 'OPENCLAW_SERVICE_VERSION=\K[^\s"]+' /home/ubuntu/.config/systemd/user/openclaw-gateway.service 2>/dev/null || echo ""
      args:
        executable: /bin/bash
      register: daemon_service_version
      changed_when: false

    - name: Get installed openclaw version
      ansible.builtin.command: openclaw --version
      register: openclaw_binary_version
      changed_when: false

    - name: Extract binary semver
      ansible.builtin.set_fact:
        openclaw_binary_semver: >-
          {{ openclaw_binary_version.stdout | regex_search('[0-9]+\.[0-9]+\.[0-9]+') | default('') }}

    - name: Regenerate daemon service file if version drifted
      ansible.builtin.shell: |
        export XDG_RUNTIME_DIR=/run/user/1000
        openclaw daemon install --force
        systemctl --user daemon-reload
        echo "REGENERATED: service={{ daemon_service_version.stdout | trim }} binary={{ openclaw_binary_semver }}"
      args:
        executable: /bin/bash
      register: daemon_version_regen
      changed_when: true
      notify: restart openclaw-gateway
      when: >-
        daemon_service_version.stdout | trim == "" or
        daemon_service_version.stdout | trim != openclaw_binary_semver

# The WS handshake timeout drop-in is no longer needed — 10s is the upstream
# default since 2026.3.22 (PR #49262). Clean up the orphan file.
- name: Remove legacy handshake timeout drop-in (10s is now the upstream default)
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/handshake-timeout.conf
    state: absent
  notify:
    - reload user systemd
    - restart openclaw-gateway

- name: Ensure OpenClaw gateway systemd drop-in directory exists
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d
    state: directory
    mode: "0750"
  when: gog_keyring_password is defined and gog_keyring_password | length > 0

- name: Configure Gog keyring password for OpenClaw gateway
  ansible.builtin.copy:
    dest: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/gog-keyring.conf
    mode: "0600"
    content: |
      [Service]
      Environment="GOG_KEYRING_PASSWORD={{ gog_keyring_password }}"
  no_log: true
  when: gog_keyring_password is defined and gog_keyring_password | length > 0
  notify:
    - reload user systemd
    - restart openclaw-gateway

- name: Remove Gog keyring drop-in when no password is configured
  ansible.builtin.file:
    path: /home/ubuntu/.config/systemd/user/openclaw-gateway.service.d/gog-keyring.conf
    state: absent
  when: gog_keyring_password is not defined or gog_keyring_password | length == 0
  notify:
    - reload user systemd
    - restart openclaw-gateway

- name: Check Gog binary location
  ansible.builtin.stat:
    path: /usr/local/bin/gog
  register: gog_usr_local_bin
  when: gog_keyring_password is defined and gog_keyring_password | length > 0

- name: Install Gog keyring wrapper for direct CLI use
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -x /usr/local/lib/gog-bin/gog ]; then
      mkdir -p /usr/local/lib/gog-bin
      mv /usr/local/bin/gog /usr/local/lib/gog-bin/gog
    fi
    cat >/usr/local/bin/gog <<'EOF'
    #!/usr/bin/env bash
    export GOG_KEYRING_PASSWORD="${GOG_KEYRING_PASSWORD:-{{ gog_keyring_password }}}"
    exec /usr/local/lib/gog-bin/gog "$@"
    EOF
    chmod 0755 /usr/local/bin/gog
  args:
    executable: /bin/bash
  no_log: true
  when:
    - gog_keyring_password is defined
    - gog_keyring_password | length > 0
    - gog_usr_local_bin.stat.exists | default(false)
