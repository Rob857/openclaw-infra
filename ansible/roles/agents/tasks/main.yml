---
- name: Get existing agents
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    openclaw agents list --json 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d'
  args:
    executable: /bin/bash
  register: existing_agents
  changed_when: false

- block:
    - name: Write existing agents JSON to temp file
      ansible.builtin.copy:
        content: "{{ existing_agents.stdout }}"
        dest: /tmp/ansible_existing_agents.json
        mode: '0600'
      changed_when: false

    - name: Create non-default agents
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        if jq -e --arg id {{ item.id | quote }} '.[] | select(.id == $id)' /tmp/ansible_existing_agents.json > /dev/null 2>&1; then
            echo "Agent {{ item.id }} already exists"
        else
            openclaw agents add {{ item.id | quote }} --non-interactive --workspace "/home/ubuntu/.openclaw/workspace-{{ item.id }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: agent_create
      changed_when: "'already exists' not in agent_create.stdout"
      notify: restart openclaw-gateway
  always:
    - name: Clean up existing agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_existing_agents.json
        state: absent
      changed_when: false

- name: Refresh agent list for config targeting
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR=/run/user/1000
    openclaw agents list --json 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d'
  args:
    executable: /bin/bash
  register: agents_current
  changed_when: false

# Default agent uses agents.defaults.* (implicit, not in agents.list)
- name: Remove default agent heartbeat targeting
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    CURRENT=$(openclaw config get "agents.defaults.heartbeat" 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
        if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
            echo "OK"
            exit 0
        fi
        echo "ERROR reading heartbeat config for default agent: $CURRENT" >&2
        exit 1
    }
    openclaw config unset "agents.defaults.heartbeat"
    echo "UPDATED: removed default agent heartbeat"
  args:
    executable: /bin/bash
  when: not (openclaw_heartbeats_enabled | default(true))
  register: default_heartbeat_remove_result
  changed_when: "'UPDATED' in (default_heartbeat_remove_result.stdout | default(''))"
  notify: restart openclaw-gateway

- name: Set default agent heartbeat targeting
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    DESIRED='{"target":"{{ _default_agent.deliver_channel | default('telegram') }}","to":"{{ _default_agent.deliver_to }}","every":"{{ _default_agent.heartbeat_every | default(openclaw_heartbeat_interval) }}"{% if _default_agent.heartbeat_model is defined %},"model":"{{ _default_agent.heartbeat_model }}"{% endif %}}'
    CURRENT=$(openclaw config get "agents.defaults.heartbeat" 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
        if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
            CURRENT="{}"
        else
            echo "ERROR reading heartbeat config for default agent: $CURRENT" >&2
            exit 1
        fi
    }
    D_NORM=$(echo "$DESIRED" | jq -cS '.')
    C_FILTERED=$(echo "$CURRENT" | jq -cS --argjson d "$DESIRED" 'with_entries(select(.key | IN($d | keys[])))' 2>/dev/null || echo "PARSE_FAIL")
    if [ "$C_FILTERED" = "$D_NORM" ]; then
        echo "OK"
    else
        openclaw config set "agents.defaults.heartbeat" --json "$DESIRED"
        echo "UPDATED: default agent heartbeat → {{ _default_agent.deliver_channel | default('telegram') }}:{{ _default_agent.deliver_to }}"
    fi
  args:
    executable: /bin/bash
  vars:
    _default_agent: "{{ openclaw_agents | selectattr('is_default', 'equalto', true) | first }}"
  when:
    - openclaw_heartbeats_enabled | default(true)
    - (_default_agent.deliver_to | default('')) != ''
  register: default_heartbeat_result
  changed_when: "'UPDATED' in (default_heartbeat_result.stdout | default(''))"
  notify: restart openclaw-gateway

- name: Set default agent sandbox mode
  ansible.builtin.shell: |
    set -euo pipefail
    export XDG_RUNTIME_DIR=/run/user/1000
    CURRENT=$(openclaw config get "agents.defaults.sandbox.mode" 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || CURRENT=""
    DESIRED="{{ _default_agent.sandbox_mode }}"
    if [ "$CURRENT" = "$DESIRED" ]; then
        echo "OK"
    else
        openclaw config set "agents.defaults.sandbox.mode" "$DESIRED"
        echo "UPDATED: default agent sandbox.mode → {{ _default_agent.sandbox_mode }}"
    fi
  args:
    executable: /bin/bash
  vars:
    _default_agent: "{{ openclaw_agents | selectattr('is_default', 'equalto', true) | first }}"
  when: _default_agent.sandbox_mode is defined
  register: default_sandbox_result
  changed_when: "'UPDATED' in (default_sandbox_result.stdout | default(''))"
  notify: restart openclaw-gateway

# OpenClaw currently validates `agents.defaults.subagents` without `allowAgents`.
# Keep delegation allowlists on explicit non-default agent entries only.

# Non-default agents use agents.list.N.* (explicit entries)
- block:
    - name: Write current agents JSON to temp file
      ansible.builtin.copy:
        content: "{{ agents_current.stdout }}"
        dest: /tmp/ansible_agents_current.json
        mode: '0600'
      changed_when: false

    - name: Set non-default agent heartbeat targeting
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list after creation step" >&2
            cat /tmp/ansible_agents_current.json >&2
            exit 1
        fi
        DESIRED='{"target":"{{ item.deliver_channel | default('telegram') }}","to":"{{ item.deliver_to }}","every":"{{ item.heartbeat_every | default(openclaw_heartbeat_interval) }}"{% if item.heartbeat_model is defined %},"model":"{{ item.heartbeat_model }}"{% endif %}}'
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.heartbeat" 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
            if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
                CURRENT="{}"
            else
                echo "ERROR reading heartbeat config for {{ item.id }}: $CURRENT" >&2
                exit 1
            fi
        }
        # Compare only the fields we set — gateway may enrich with extra fields (e.g. model)
        D_NORM=$(echo "$DESIRED" | jq -cS '.')
        C_FILTERED=$(echo "$CURRENT" | jq -cS --argjson d "$DESIRED" 'with_entries(select(.key | IN($d | keys[])))' 2>/dev/null || echo "PARSE_FAIL")
        if [ "$C_FILTERED" = "$D_NORM" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.heartbeat" --json "$DESIRED"
            echo "UPDATED: {{ item.id }} heartbeat → {{ item.deliver_channel | default('telegram') }}:{{ item.deliver_to }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | selectattr('deliver_to', 'defined') | selectattr('deliver_to', 'ne', '') | list }}"
      loop_control:
        label: "{{ item.id }} → {{ item.deliver_to }}"
      register: heartbeat_result
      changed_when: "'UPDATED' in heartbeat_result.stdout"
      notify: restart openclaw-gateway

    - name: Remove non-default agent heartbeats
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list after creation step" >&2
            cat /tmp/ansible_agents_current.json >&2
            exit 1
        fi
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.heartbeat" 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
            if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
                echo "OK"
                exit 0
            fi
            echo "ERROR reading heartbeat config for {{ item.id }}: $CURRENT" >&2
            exit 1
        }
        openclaw config unset "agents.list.${AGENT_INDEX}.heartbeat"
        echo "UPDATED: removed {{ item.id }} heartbeat"
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.id }}"
      when: not (openclaw_heartbeats_enabled | default(true))
      register: heartbeat_remove_result
      changed_when: "'UPDATED' in heartbeat_remove_result.stdout"
      notify: restart openclaw-gateway

    - name: Set non-default agent sandbox mode override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.sandbox.mode" 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || CURRENT=""
        DESIRED="{{ item.sandbox_mode }}"
        if [ "$CURRENT" = "$DESIRED" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.sandbox.mode" "$DESIRED"
            echo "UPDATED: {{ item.id }} sandbox.mode → {{ item.sandbox_mode }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | selectattr('sandbox_mode', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }} → {{ item.sandbox_mode }}"
      register: sandbox_result
      changed_when: "'UPDATED' in sandbox_result.stdout"
      notify: restart openclaw-gateway

    - name: Set non-default agent model primary override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.model.primary" 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || CURRENT=""
        DESIRED="{{ item.model_primary }}"
        if [ "$CURRENT" = "$DESIRED" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.model.primary" "$DESIRED"
            echo "UPDATED: {{ item.id }} model.primary -> {{ item.model_primary }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('model_primary', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }} -> {{ item.model_primary }}"
      register: model_primary_result
      changed_when: "'UPDATED' in model_primary_result.stdout"
      notify: restart openclaw-gateway
      when: openclaw_manage_models | default(true) | bool

    - name: Set per-agent thinking default override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.thinkingDefault" 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || CURRENT=""
        DESIRED="{{ item.thinking_default }}"
        if [ "$CURRENT" = "$DESIRED" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.thinkingDefault" "$DESIRED"
            echo "UPDATED: {{ item.id }} thinkingDefault -> {{ item.thinking_default }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('thinking_default', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }} -> {{ item.thinking_default }}"
      register: thinking_default_result
      changed_when: "'UPDATED' in thinking_default_result.stdout"
      notify: restart openclaw-gateway

    - name: Set non-default agent model fallback overrides
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        DESIRED='{{ item.model_fallbacks | to_json }}'
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.model.fallbacks" 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
            if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
                CURRENT="[]"
            else
                echo "ERROR reading model fallbacks for {{ item.id }}: $CURRENT" >&2
                exit 1
            fi
        }
        C_NORM=$(echo "$CURRENT" | jq -cS '.' 2>/dev/null || echo "PARSE_FAIL")
        D_NORM=$(echo "$DESIRED" | jq -cS '.')
        if [ "$C_NORM" != "PARSE_FAIL" ] && [ "$C_NORM" = "$D_NORM" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.model.fallbacks" --json "$DESIRED"
            echo "UPDATED: {{ item.id }} model.fallbacks"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('model_fallbacks', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: model_fallbacks_result
      changed_when: "'UPDATED' in model_fallbacks_result.stdout"
      notify: restart openclaw-gateway
      when: openclaw_manage_models | default(true) | bool

    - name: Set non-default agent display name override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.name" 2>/dev/null | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || CURRENT=""
        DESIRED="{{ item.name }}"
        if [ "$CURRENT" = "$DESIRED" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.name" "$DESIRED"
            echo "UPDATED: {{ item.id }} name -> {{ item.name }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | selectattr('name', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }} -> {{ item.name }}"
      register: agent_name_result
      changed_when: "'UPDATED' in agent_name_result.stdout"
      notify: restart openclaw-gateway

    - name: Set non-default agent subagent allowlist override
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        AGENT_INDEX=$(jq -r --arg id {{ item.id | quote }} 'to_entries[] | select(.value.id == $id) | .key' /tmp/ansible_agents_current.json)
        if [ -z "$AGENT_INDEX" ]; then
            echo "ERROR: Agent {{ item.id | quote }} not found in agents list" >&2
            exit 1
        fi
        DESIRED='{{ item.subagent_allow_agents | to_json }}'
        CURRENT=$(openclaw config get "agents.list.${AGENT_INDEX}.subagents.allowAgents" 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
            if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
                CURRENT="[]"
            else
                echo "ERROR reading subagent allowlist for {{ item.id }}: $CURRENT" >&2
                exit 1
            fi
        }
        C_NORM=$(echo "$CURRENT" | jq -cS '.' 2>/dev/null || echo "PARSE_FAIL")
        D_NORM=$(echo "$DESIRED" | jq -cS '.')
        if [ "$C_NORM" != "PARSE_FAIL" ] && [ "$C_NORM" = "$D_NORM" ]; then
            echo "OK"
        else
            openclaw config set "agents.list.${AGENT_INDEX}.subagents.allowAgents" --json "$DESIRED"
            echo "UPDATED: {{ item.id }} subagents.allowAgents"
        fi
      args:
        executable: /bin/bash
      loop: "{{ openclaw_agents | selectattr('is_default', 'equalto', false) | selectattr('subagent_allow_agents', 'defined') | list }}"
      loop_control:
        label: "{{ item.id }}"
      register: subagent_allowlist_result
      changed_when: "'UPDATED' in subagent_allowlist_result.stdout"
      notify: restart openclaw-gateway

    - name: Write desired bindings JSON to temp file
      ansible.builtin.copy:
        content: "{{ openclaw_bindings | to_json }}"
        dest: /tmp/ansible_bindings.json
        mode: '0600'
      changed_when: false
      when: openclaw_bindings is defined

    - name: Set agent bindings from declarative config
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/1000
        DESIRED=$(cat /tmp/ansible_bindings.json)
        CURRENT=$(openclaw config get bindings 2>&1 | sed '/^\[mcp-adapter\]/d; /^\[plugins\]/d') || {
            if echo "$CURRENT" | grep -qi "not set\|not found\|does not exist\|undefined"; then
                CURRENT="[]"
            else
                echo "ERROR reading bindings: $CURRENT" >&2
                exit 1
            fi
        }
        C_NORM=$(echo "$CURRENT" | jq -cS '.' 2>/dev/null || echo "PARSE_FAIL")
        D_NORM=$(echo "$DESIRED" | jq -cS '.')
        if [ "$C_NORM" != "PARSE_FAIL" ] && [ "$C_NORM" = "$D_NORM" ]; then
            echo "OK"
        else
            openclaw config set bindings --json "$DESIRED"
            echo "UPDATED: bindings"
        fi
      args:
        executable: /bin/bash
      when: openclaw_bindings is defined
      register: declarative_bindings_result
      changed_when: "'UPDATED' in declarative_bindings_result.stdout"
      notify: restart openclaw-gateway

    - name: Write desired agent model config to temp file
      ansible.builtin.copy:
        content: "{{ openclaw_agents | to_json }}"
        dest: /tmp/ansible_agents_desired.json
        mode: '0600'
      changed_when: false

    - name: Clean stale Slack sessions after model/auth changes
      ansible.builtin.shell: |
        set -euo pipefail
        python3 << 'PYEOF'
        import json
        import os
        from datetime import datetime

        with open("/tmp/ansible_agents_desired.json") as f:
            agents = json.load(f)

        desired = {}
        for agent in agents:
            agent_id = agent["id"]
            primary = agent.get("model_primary") or "{{ openclaw_model_primary }}"
            if "/" in primary:
                provider, short_model = primary.split("/", 1)
            else:
                provider, short_model = "", primary
            desired[agent_id] = {
                "provider": provider,
                "short_model": short_model,
            }

        changed = False
        timestamp = datetime.utcnow().strftime("%Y-%m-%dT%H-%M-%S.%fZ")

        for agent_id, model_info in desired.items():
            sessions_path = f"/home/ubuntu/.openclaw/agents/{agent_id}/sessions/sessions.json"
            if not os.path.exists(sessions_path):
                continue

            with open(sessions_path) as f:
                store = json.load(f)

            keys_to_remove = []
            for key, entry in store.items():
                if not key.startswith(f"agent:{agent_id}:slack:"):
                    continue
                if not isinstance(entry, dict):
                    continue

                reasons = []
                if entry.get("authProfileOverride"):
                    reasons.append("authProfileOverride")

                entry_model = entry.get("model")
                if entry_model and entry_model != model_info["short_model"]:
                    reasons.append(f"model={entry_model}")

                entry_provider = entry.get("modelProvider")
                if entry_provider and model_info["provider"] and entry_provider != model_info["provider"]:
                    reasons.append(f"provider={entry_provider}")

                if reasons:
                    keys_to_remove.append((key, entry.get("sessionId", ""), ",".join(reasons)))

            if not keys_to_remove:
                continue

            for key, session_id, reason_text in keys_to_remove:
                entry = store.pop(key, None)
                if not entry:
                    continue
                print(f"FIXED: removed stale slack session {key} ({reason_text})")
                changed = True
                if not session_id:
                    continue
                base = f"/home/ubuntu/.openclaw/agents/{agent_id}/sessions/{session_id}.jsonl"
                lock = f"{base}.lock"
                if os.path.exists(base):
                    os.rename(base, f"{base}.deleted.{timestamp}")
                if os.path.exists(lock):
                    os.remove(lock)

            with open(sessions_path, "w") as f:
                json.dump(store, f, indent=2)

        if not changed:
            print("OK: no stale slack sessions found")
        PYEOF
      args:
        executable: /bin/bash
      register: slack_session_cleanup_result
      changed_when: "'FIXED' in slack_session_cleanup_result.stdout"
      notify: restart openclaw-gateway

  always:
    - name: Clean up bindings temp file
      ansible.builtin.file:
        path: /tmp/ansible_bindings.json
        state: absent
      changed_when: false

    - name: Clean up current agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_agents_current.json
        state: absent
      changed_when: false

    - name: Clean up desired agents temp file
      ansible.builtin.file:
        path: /tmp/ansible_agents_desired.json
        state: absent
      changed_when: false
